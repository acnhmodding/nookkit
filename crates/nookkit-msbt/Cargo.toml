[package]
name = "nookkit-msbt"
version = "0.2.0"
edition = "2024"

[features]
cli = ["dep:ruzstd", "dep:nookkit-sarc"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ruzstd = { workspace = true, optional = true }
nookkit-sarc = { workspace = true, optional = true }

[dev-dependencies]
ruzstd = { workspace = true }
nookkit-sarc = { workspace = true }

[[bin]]
name = "nookkit-msbt"
required-features = ["cli"]
