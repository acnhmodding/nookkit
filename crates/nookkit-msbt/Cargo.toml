[package]
name = "nookkit-msbt"
version = "0.2.0"
edition = "2024"

[features]
cli = ["dep:ruzstd", "dep:nookkit-sarc"]

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
ruzstd = { workspace = true, optional = true }
