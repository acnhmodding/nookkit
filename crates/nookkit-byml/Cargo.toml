[package]
name = "nookkit-byml"
version = "0.1.0"
edition = "2024"

[features]
cli = ["dep:nookkit-sarc"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = { workspace = true }
nookkit-sarc = { workspace = true, optional = true }

[dev-dependencies]
nookkit-sarc = { workspace = true }

[[bin]]
name = "nookkit-byml"
required-features = ["cli"]

[lints]
workspace = true
