name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # HewDraw Remix's builder: cargo-skyline 3.5.0 with skyline-v3, pinned so image updates can't change builds
    container: wuboyth/skyline-plugin-builder@sha256:fb035a9aa2a707f41846393dcc56595e24a824b9584b6486c2a1db41b326d0e7
    permissions:
      contents: write
    env:
      HOME: /root
      NRO: target/aarch64-skyline-switch/release/libnookkit_core.nro
    steps:
      - uses: actions/checkout@v4

      - name: Build the plugin
        working-directory: crates/nookkit-core
        run: cargo skyline build --release

      - uses: actions/upload-artifact@v4
        with:
          name: libnookkit_core
          path: ${{ env.NRO }}
          if-no-files-found: error

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.NRO }}
          generate_release_notes: true

      # The release action won't move an existing tag, so point `latest` at this commit first
      - name: Move the latest tag
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git tag -f latest
          git push -f origin latest

      - name: Latest build
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest build
          prerelease: true
          make_latest: false
          body: |
            Built from ${{ github.sha }} on `main`, replaced on every push.
            For a stable build, use the newest versioned release.
          files: ${{ env.NRO }}
          overwrite_files: true
